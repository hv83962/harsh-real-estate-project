<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harsh Real Estate - Access Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-blue: #2563eb;
            --primary-dark: #1d4ed8;
            --dark-navy: #0f172a;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0b1320 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
            color: #f8fafc;
        }

        /* Glassmorphism Auth Card */
        .auth-container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 960px;
            width: 100%;
            overflow: hidden;
        }

        .auth-brand-pane {
            background: linear-gradient(160deg, rgba(37, 99, 235, 0.9), rgba(15, 23, 42, 0.95)), 
                        url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=800&auto=format&fit=crop&q=80') center/cover no-repeat;
            padding: 45px 35px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .brand-icon-box {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #ffffff;
        }

        .auth-tabs {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            padding: 5px;
            display: flex;
            gap: 5px;
            margin-bottom: 25px;
        }

        .auth-tab-btn {
            flex: 1;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 10px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .auth-tab-btn.active {
            background: var(--primary-blue);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .form-control-custom {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.92rem;
            transition: all 0.2s ease;
        }

        .form-control-custom:focus {
            background: rgba(15, 23, 42, 0.85);
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
            color: #ffffff;
        }

        .form-control-custom::placeholder {
            color: #64748b;
        }

        .btn-auth-primary {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border: none;
            color: #ffffff;
            font-weight: 600;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
            transition: all 0.2s ease;
        }

        .btn-auth-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
            color: #ffffff;
        }

        .modal-content-glass {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border-radius: 20px;
        }
    </style>
</head>
<body>

<div class="auth-container row g-0">
    <!-- Left Hero Pane -->
    <div class="col-lg-5 auth-brand-pane d-none d-lg-flex">
        <div>
            <div class="d-flex align-items-center gap-3 mb-4">
                <div class="brand-icon-box">
                    <i class="bi bi-buildings-fill"></i>
                </div>
                <div>
                    <h5 class="fw-bold m-0 text-white">Harsh Real Estate</h5>
                    <small class="text-white-50 text-uppercase" style="letter-spacing: 1px;">Access Portal</small>
                </div>
            </div>
            <h3 class="fw-bold text-white mt-4">Manage & Discover Prime Real Estate</h3>
            <p class="text-white-50 mt-2 small">
                Log in to monitor property leads, manage your active listings, or save your dream homes directly to your wishlist.
            </p>
        </div>
        <div class="pt-4 border-top border-white border-opacity-10">
            <a href="index.html" class="text-white-50 text-decoration-none small d-flex align-items-center gap-2">
                <i class="bi bi-arrow-left"></i> Return to Live Website
            </a>
        </div>
    </div>

    <!-- Right Form Pane -->
    <div class="col-lg-7 p-4 p-md-5">
        <!-- Switch Tabs -->
        <div class="auth-tabs">
            <button class="auth-tab-btn active" id="tabLoginBtn" onclick="switchTab('login')">
                <i class="bi bi-box-arrow-in-right me-1"></i> Login
            </button>
            <button class="auth-tab-btn" id="tabRegisterBtn" onclick="switchTab('register')">
                <i class="bi bi-person-plus me-1"></i> Register
            </button>
        </div>

        <div id="authAlert"></div>

        <!-- 1. Login Form -->
        <form id="loginForm" class="d-flex flex-column gap-3">
            <div>
                <label class="form-label small text-secondary fw-semibold">Email Address</label>
                <div class="input-group">
                    <input type="email" id="login_email" class="form-control form-control-custom" placeholder="name@example.com" required>
                </div>
            </div>

            <div>
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label small text-secondary fw-semibold m-0">Password</label>
                    <!-- Trigger Forgot Password Modal -->
                    <a href="#" class="small text-primary text-decoration-none fw-semibold" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">
                        Forgot Password?
                    </a>
                </div>
                <input type="password" id="login_password" class="form-control form-control-custom" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-auth-primary w-100 mt-2">
                Sign In to Account
            </button>
        </form>

        <!-- 2. Register Form -->
        <form id="registerForm" class="d-none flex-column gap-3">
            <div>
                <label class="form-label small text-secondary fw-semibold">Full Name</label>
                <input type="text" id="reg_name" class="form-control form-control-custom" placeholder="Enter your full name" required>
            </div>

            <div>
                <label class="form-label small text-secondary fw-semibold">Email Address</label>
                <input type="email" id="reg_email" class="form-control form-control-custom" placeholder="name@example.com" required>
            </div>

            <div>
                <label class="form-label small text-secondary fw-semibold">Phone Number</label>
                <input type="tel" id="reg_phone" class="form-control form-control-custom" placeholder="Enter 10-digit mobile number">
            </div>

            <div>
                <label class="form-label small text-secondary fw-semibold">Password</label>
                <input type="password" id="reg_password" class="form-control form-control-custom" placeholder="Create a secure password (min 6 chars)" required>
            </div>

            <button type="submit" class="btn btn-auth-primary w-100 mt-2">
                Create Account
            </button>
        </form>
    </div>
</div>

<!-- 3. Forgot Password Modal -->
<div class="modal fade" id="forgotPasswordModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content modal-content-glass p-3">
            <div class="modal-header border-0 pb-1">
                <h5 class="modal-title fw-bold"><i class="bi bi-key-fill text-warning me-2"></i>Reset Password</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body pt-2">
                <p class="small text-secondary mb-3">Enter your registered email and choose a new password.</p>
                <div id="resetAlert"></div>
                <form id="resetPasswordForm" class="d-flex flex-column gap-3">
                    <div>
                        <label class="form-label small text-secondary fw-semibold">Registered Email</label>
                        <input type="email" id="reset_email" class="form-control form-control-custom" placeholder="name@example.com" required>
                    </div>
                    <div>
                        <label class="form-label small text-secondary fw-semibold">New Password</label>
                        <input type="password" id="reset_password" class="form-control form-control-custom" placeholder="Enter new password (min 6 chars)" required>
                    </div>
                    <button type="submit" class="btn btn-auth-primary w-100 mt-2">
                        Update Password
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function switchTab(tab) {
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const tabLoginBtn = document.getElementById('tabLoginBtn');
    const tabRegisterBtn = document.getElementById('tabRegisterBtn');
    const alertBox = document.getElementById('authAlert');

    alertBox.innerHTML = '';

    if (tab === 'login') {
        loginForm.classList.remove('d-none');
        loginForm.classList.add('d-flex');
        registerForm.classList.add('d-none');
        registerForm.classList.remove('d-flex');
        tabLoginBtn.classList.add('active');
        tabRegisterBtn.classList.remove('active');
    } else {
        registerForm.classList.remove('d-none');
        registerForm.classList.add('d-flex');
        loginForm.classList.add('d-none');
        loginForm.classList.remove('d-flex');
        tabRegisterBtn.classList.add('active');
        tabLoginBtn.classList.remove('active');
    }
}

// 1. Login Handler
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById('authAlert');
    alertBox.innerHTML = '';

    const payload = {
        email: document.getElementById('login_email').value,
        password: document.getElementById('login_password').value
    };

    try {
        const res = await fetch('api/login.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (res.ok && data.status === 'success') {
            alertBox.innerHTML = `<div class="alert alert-success py-2 small">Welcome back, ${data.user.name}! Redirecting...</div>`;
            localStorage.setItem('user', JSON.stringify(data.user));
            setTimeout(() => {
                window.location.href = data.user.role === 'admin' ? 'admin.html' : 'dashboard.html';
            }, 1000);
        } else {
            alertBox.innerHTML = `<div class="alert alert-danger py-2 small">${data.message || 'Login failed.'}</div>`;
        }
    } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-danger py-2 small">Server connection error.</div>`;
    }
});

// 2. Register Handler
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById('authAlert');
    alertBox.innerHTML = '';

    const payload = {
        name: document.getElementById('reg_name').value,
        email: document.getElementById('reg_email').value,
        phone: document.getElementById('reg_phone').value,
        password: document.getElementById('reg_password').value
    };

    try {
        const res = await fetch('api/register.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (res.ok && data.status === 'success') {
            alertBox.innerHTML = `<div class="alert alert-success py-2 small">${data.message} Please login.</div>`;
            document.getElementById('registerForm').reset();
            setTimeout(() => switchTab('login'), 1200);
        } else {
            alertBox.innerHTML = `<div class="alert alert-danger py-2 small">${data.message}</div>`;
        }
    } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-danger py-2 small">Registration failed.</div>`;
    }
});

// 3. Reset Password Handler
document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById('resetAlert');
    alertBox.innerHTML = '';

    const payload = {
        email: document.getElementById('reset_email').value,
        new_password: document.getElementById('reset_password').value
    };

    try {
        const res = await fetch('api/reset_password.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (res.ok && data.status === 'success') {
            alertBox.innerHTML = `<div class="alert alert-success py-2 small">${data.message}</div>`;
            document.getElementById('resetPasswordForm').reset();
            setTimeout(() => {
                bootstrap.Modal.getInstance(document.getElementById('forgotPasswordModal')).hide();
                switchTab('login');
            }, 1500);
        } else {
            alertBox.innerHTML = `<div class="alert alert-danger py-2 small">${data.message}</div>`;
        }
    } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-danger py-2 small">Reset request failed.</div>`;
    }
});
</script>
</body>
</html>
